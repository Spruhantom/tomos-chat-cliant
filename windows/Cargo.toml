[package]
name = "tomchat-windows"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native Windows desktop client for TomChat"

[dependencies]
tomchat-noise = { path = "../android/native/tomchat-noise" }
zeroize = "1.8.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
