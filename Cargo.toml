[package]
name = "tomchat-client"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native Linux desktop client for TomChat"

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-native-roots"] }

# MLS E2EE protocol and reviewed RustCrypto implementation.
openmls = "=0.9.2"
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
tls_codec = { version = "=0.5.0", features = ["derive", "serde", "mls"] }

# Authenticated encryption for locally persisted MLS state.
chacha20poly1305 = "=0.10.1"
getrandom = "=0.2.17"
zeroize = "=1.9.1"
