name: Publish TomChat Android debug prerelease

on:
  workflow_run:
    workflows: ["TomChat Android CI"]
    types: [completed]
    branches: [android-rebuild]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Publish verified Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from successful Android CI run
        uses: actions/download-artifact@v4
        with:
          name: tomchat-debug-apk
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s release-assets/app-debug.apk
          file release-assets/app-debug.apk
          sha256sum release-assets/app-debug.apk

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tomchat-android-debug-2026.11.09-${{ github.event.workflow_run.run_number }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: TomChat Android Debug Test Build - 9 November 2026
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/app-debug.apk
          body: |
            TomChat Android debug build for controlled real-device testing.

            Includes the adult-only debug test mode for signed contact-card exchange, private approved-contact messaging and one-to-one voice calls. This override is restricted to debug builds and adult-classified accounts with guardian state NOT_REQUIRED. Child and teen accounts remain subject to normal age-assurance and guardian requirements. Public discovery, public posting, groups and file sharing are not enabled by this override.

            Automated Android CI passed for the exact commit attached to this release, including Rust Noise/JNI tests, JVM loopback integration tests, Android instrumentation source compilation, APK build and JNI export verification.

            This is a debug prerelease, not a production release. Voice calling remains a prototype and must be tested on physical Android devices. Use only with consenting adult testers.
