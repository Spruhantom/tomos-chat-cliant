name: Publish TomChat Android test release

on:
  workflow_run:
    workflows: ["TomChat Android CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Publish verified Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from successful Android CI run
        uses: actions/download-artifact@v4
        with:
          name: tomchat-release-apk
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s release-assets/app-release.apk
          file release-assets/app-release.apk
          sha256sum release-assets/app-release.apk | tee release-assets/SHA256SUMS

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tomchat-android-test-${{ github.event.workflow_run.run_number }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: TomChat Android Test Release
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |\n            release-assets/app-release.apk\n            release-assets/SHA256SUMS
          body: |
            TomChat Android release-variant APK for controlled real-device testing. This APK is signed with the standard Android debug key because no production keystore has been configured.

            Includes the adult-only debug test mode for signed contact-card exchange, private approved-contact messaging and one-to-one voice calls. This override is restricted to debug builds and adult-classified accounts with guardian state NOT_REQUIRED. Child and teen accounts remain subject to normal age-assurance and guardian requirements. Public discovery, public posting, groups and file sharing are not enabled by this override.

            Automated Android CI passed for the exact commit attached to this release, including Rust Noise/JNI tests, JVM loopback integration tests, Android instrumentation source compilation, APK build and JNI export verification.

            This is a TEST prerelease, not a production-signed release. The APK uses the Android debug signing key; do not distribute it as a public production build. Future updates must use the same debug key to install over this test build. Voice calling remains a prototype and must be tested on physical Android devices. Use only with consenting adult testers.
