name: Publish TomChat Android debug prerelease

on:
  workflow_run:
    workflows: ["TomChat Android CI"]
    types: [completed]
    branches: [main, android-rebuild]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Publish verified Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Download debug APK from successful Android CI run
        uses: actions/download-artifact@v4
        with:
          name: tomchat-debug-apk
          path: release-assets/debug
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release-variant APK from successful Android CI run
        uses: actions/download-artifact@v4
        with:
          name: tomchat-release-apk
          path: release-assets/release
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify APK files and generate checksums
        run: |
          set -euo pipefail
          test -s release-assets/debug/app-debug.apk
          test -s release-assets/release/app-release.apk
          file release-assets/debug/app-debug.apk
          file release-assets/release/app-release.apk
          sha256sum release-assets/debug/app-debug.apk release-assets/release/app-release.apk > release-assets/SHA256SUMS
          cat release-assets/SHA256SUMS

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tomchat-android-ci-${{ github.event.workflow_run.head_sha }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: TomChat Android CI Test Build #${{ github.event.workflow_run.run_number }}
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-assets/debug/app-debug.apk
            release-assets/release/app-release.apk
            release-assets/SHA256SUMS
          body: |
            TomChat Android test APKs built from the exact ${{ github.event.workflow_run.head_sha }} commit on ${{ github.event.workflow_run.head_branch }}.

            Included files:
            - `app-debug.apk`: Android debug build.
            - `app-release.apk`: release-variant build signed with the Android debug key; this is not production-signed.
            - `SHA256SUMS`: SHA-256 checksums for both APKs.

            The APKs are published only after the Android CI workflow succeeds for this exact commit. Automated CI passing does not replace physical-device testing or Android-to-Linux interoperability testing.

            This is a prerelease for controlled testing, not a production release. Do not use it for sensitive or emergency communications.
