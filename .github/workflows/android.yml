name: TomChat Android CI

on:
  push:
    branches: [main, android-rebuild]
  pull_request:
    branches: [main, android-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build and test Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle --no-daemon :android:app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :android:app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tomchat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
