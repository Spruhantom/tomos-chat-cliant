name: client-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK development libraries and shellcheck
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev shellcheck
      - name: Validate Linux installer syntax
        run: bash -n install.sh
      - name: Lint Linux installer
        run: shellcheck install.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test shared Noise and peer transport core
        run: cargo test --manifest-path android/native/tomchat-noise/Cargo.toml
      - name: Lint shared Noise and peer transport core
        run: cargo clippy --manifest-path android/native/tomchat-noise/Cargo.toml --all-targets -- -D warnings
      - name: Check Rust project
        run: cargo check && git diff -- Cargo.lock
      - name: Run Rust test suite
        run: cargo test --locked
      - name: Run full Rust Clippy checks
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
