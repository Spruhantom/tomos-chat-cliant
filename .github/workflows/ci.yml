name: client-ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK development libraries and shellcheck
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev shellcheck
      - name: Validate Linux installer syntax
        run: bash -n install.sh
      - name: Lint Linux installer
        run: shellcheck install.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test shared Noise and peer transport core
        run: cargo test --manifest-path android/native/tomchat-noise/Cargo.toml
      - name: Lint shared Noise and peer transport core
        run: cargo clippy --manifest-path android/native/tomchat-noise/Cargo.toml --all-targets -- -D warnings
      - name: Check Rust project
        run: cargo check
      - name: Upload resolved Cargo lockfile for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

      - name: Commit refreshed Cargo.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Cargo.lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run Rust test suite
        run: cargo test --locked
      - name: Run full Rust Clippy checks
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
