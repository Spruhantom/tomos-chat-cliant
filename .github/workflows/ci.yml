name: client-ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK development libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo generate-lockfile
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Commit generated lockfile and formatting
        if: success() && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock src/*.rs
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock realtime dependencies and format client'
            git fetch origin ${GITHUB_REF_NAME}
            git rebase origin/${GITHUB_REF_NAME}
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

