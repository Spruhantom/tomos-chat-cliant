name: Refresh Pear migration Cargo lockfile

on:
  push:
    branches: [feat/pear-p2p-backend]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pear-lockfile-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pear-p2p-backend
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Cargo.lock with Cargo
        run: cargo generate-lockfile
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Regenerate Cargo.lock for Pear identity dependency"
          git push origin HEAD:feat/pear-p2p-backend
